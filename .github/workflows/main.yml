name: LegalRobust-AI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        working-directory: LegalRobust-AI
        run: python -m unittest discover -s tests -v

      - name: Validate example cases
        working-directory: LegalRobust-AI
        run: python -m legalrobust.cli validate --input examples/cases.json
